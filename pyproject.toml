[project]
name = "costscope"
version = "0.1.0"
description = "Natural-language interface to enterprise cost data — Anthropic Claude orchestrator over a structured cost database."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Joseph Aguilar Feener", email = "joseph.feener@gmail.com" }
]
license = { text = "MIT" }

dependencies = [
    # AI layer
    "anthropic>=0.40.0,<1.0.0",
    # Data layer
    "snowflake-connector-python>=3.7.0",
    # Web / API layer
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0,<3.0.0",
    # Config
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
